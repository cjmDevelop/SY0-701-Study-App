<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SecPlus Prep</title>
    <link rel="icon" href="public/quiz_24dp_75FB4C_FILL0_wght400_GRAD0_opsz24.png">
    <link rel="stylesheet" href="src/styles/auth.css">
</head>
<body>
    <header>
        <div class="logo-container" style="display: flex; flex-direction: column; align-items: flex-start;">
            <a href="index.html" class="logo" style="line-height: 1; margin-bottom: 5px;">SecPlus Prep</a>
            <span class="logo-tagline" style="font-size: 0.65rem; color: #4ecdc4; font-weight: 500; line-height: 1;">Free Study Tool for Security+ SY0-701</span>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="quiz-menu.html">Quiz Menu</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <div class="auth-card">
                <h1>Reset Password</h1>
                <p class="auth-subtitle">Enter your email and we'll send you a reset code</p>

                <form id="forgotPasswordForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            placeholder="you@example.com"
                            autocomplete="email"
                        >
                    </div>

                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                    <div id="successMessage" class="success-message" style="display: none;"></div>

                    <!-- Resend Verification Message -->
                    <div id="resendVerification" style="display: none; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; font-weight: 600; text-align: center; background: rgba(255, 193, 7, 0.1); color: #f57c00; border: 2px solid rgba(255, 193, 7, 0.3);">
                        Email not verified. <a href="#" id="resendLink" style="color: #e65100; text-decoration: underline; font-weight: 700; cursor: pointer;">Resend verification email</a>
                    </div>

                    <button type="submit" class="auth-button" id="submitButton">
                        <span class="button-text">Send Reset Code</span>
                        <span class="button-loader" style="display: none;">
                            <svg class="spinner" viewBox="0 0 50 50">
                                <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
                            </svg>
                        </span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Remember your password? <a href="login.html">Login</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="about.html">About</a>
                <span class="separator">|</span>
                <a href="https://github.com/cjmDevelop/CyberSecurity-QuizApp-SY0-701" target="_blank">GitHub</a>
                <span class="separator">|</span>
                <a href="https://ko-fi.com/joe364671" target="_blank" class="donate-link">Tip Me</a>
            </div>
            <p class="footer-text">Made with passion for cybersecurity education</p>
        </div>
    </footer>

    <script type="module">
        import authService from './src/scripts/auth.js';

        const forgotPasswordForm = document.getElementById('forgotPasswordForm');
        const submitButton = document.getElementById('submitButton');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const resendVerification = document.getElementById('resendVerification');
        const resendLink = document.getElementById('resendLink');
        let currentEmail = '';

        // Handle form submission
        forgotPasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            currentEmail = email;

            // Clear previous messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            resendVerification.style.display = 'none';

            // Show loading state
            submitButton.disabled = true;
            submitButton.querySelector('.button-text').style.display = 'none';
            submitButton.querySelector('.button-loader').style.display = 'inline-block';

            try {
                await authService.forgotPassword(email);

                // Show success message
                successMessage.textContent = 'Reset code sent! Check your email.';
                successMessage.style.display = 'block';

                // Redirect to reset password page after short delay
                setTimeout(() => {
                    window.location.href = `reset-password.html?email=${encodeURIComponent(email)}`;
                }, 2000);

            } catch (error) {
                console.log('Forgot password error:', error.message);
                const errorText = error.message || 'Failed to send reset code. Please try again.';

                // Check if error is due to unverified email
                const isVerificationError = errorText.toLowerCase().includes('verify') ||
                                           errorText.toLowerCase().includes('not verified') ||
                                           errorText.toLowerCase().includes('email is not verified');

                if (isVerificationError) {
                    // Definitely an email verification issue
                    resendVerification.style.display = 'block';
                    errorMessage.style.display = 'none';
                    submitButton.disabled = false;
                    submitButton.querySelector('.button-text').style.display = 'inline';
                    submitButton.querySelector('.button-loader').style.display = 'none';
                } else {
                    // Generic error - might be unverified email with 500 error
                    // Try to resend verification to see if that's the issue
                    console.log('Testing if this is an unverified email issue...');

                    authService.resendVerificationEmail(email)
                        .then(() => {
                            // Success! It was an unverified email
                            console.log('✅ Detected unverified email - showing resend option');
                            localStorage.setItem('pendingUser', JSON.stringify({ email: email }));
                            successMessage.textContent = 'Your email is not verified. A verification code has been sent to your email.';
                            successMessage.style.display = 'block';
                            errorMessage.style.display = 'none';

                            // Redirect to verification page
                            setTimeout(() => {
                                window.location.href = 'verify-email.html';
                            }, 2000);
                        })
                        .catch(() => {
                            // Not an email verification issue - show the original error
                            console.log('❌ Not an unverified email issue - showing generic error');
                            errorMessage.textContent = errorText;
                            errorMessage.style.display = 'block';
                            resendVerification.style.display = 'none';
                            submitButton.disabled = false;
                            submitButton.querySelector('.button-text').style.display = 'inline';
                            submitButton.querySelector('.button-loader').style.display = 'none';
                        });
                }
            }
        });

        // Handle resend verification link click
        resendLink.addEventListener('click', async (e) => {
            e.preventDefault();

            if (!currentEmail) {
                errorMessage.textContent = 'Please enter your email first.';
                errorMessage.style.display = 'block';
                return;
            }

            try {
                resendLink.textContent = 'Sending...';
                resendLink.style.pointerEvents = 'none';

                // Show loading state
                submitButton.disabled = true;

                await authService.resendVerificationEmail(currentEmail);

                // Store email for verification page
                localStorage.setItem('pendingUser', JSON.stringify({ email: currentEmail }));

                // Show success message
                successMessage.textContent = 'Verification email sent! Redirecting...';
                successMessage.style.display = 'block';
                resendVerification.style.display = 'none';

                // Redirect to verification page
                setTimeout(() => {
                    window.location.href = 'verify-email.html';
                }, 1000);

            } catch (error) {
                errorMessage.textContent = error.message || 'Failed to resend verification email.';
                errorMessage.style.display = 'block';
                resendVerification.style.display = 'none';
                resendLink.textContent = 'Resend verification email';
                resendLink.style.pointerEvents = 'auto';
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
