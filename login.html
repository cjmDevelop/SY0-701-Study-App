<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SecPlus Prep</title>
    <link rel="icon" href="public/quiz_24dp_75FB4C_FILL0_wght400_GRAD0_opsz24.png">
    <link rel="stylesheet" href="src/styles/auth.css">
</head>
<body>
    <header>
        <div class="logo-container" style="display: flex; flex-direction: column; align-items: flex-start;">
            <a href="index.html" class="logo" style="line-height: 1; margin-bottom: 5px;">SecPlus Prep</a>
            <span class="logo-tagline" style="font-size: 0.65rem; color: #4ecdc4; font-weight: 500; line-height: 1;">Free Study Tool for Security+ SY0-701</span>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="quiz-menu.html">Quiz Menu</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <div class="auth-card">
                <h1>Welcome Back</h1>
                <p class="auth-subtitle">Login to access all SY0-701 quiz domains</p>

                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            placeholder="you@example.com"
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >
                    </div>

                    <div class="form-actions">
                        <a href="forgot-password.html" class="forgot-password">Forgot password?</a>
                    </div>

                    <div id="errorMessage" class="error-message" style="display: none;"></div>
                    <div id="successMessage" class="success-message" style="display: none;"></div>

                    <!-- Resend Verification Message -->
                    <div id="resendVerification" style="display: none; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; font-weight: 600; text-align: center; background: rgba(255, 193, 7, 0.1); color: #f57c00; border: 2px solid rgba(255, 193, 7, 0.3);">
                        Email not verified. <a href="#" id="resendLink" style="color: #e65100; text-decoration: underline; font-weight: 700; cursor: pointer;">Resend verification email</a>
                    </div>

                    <button type="submit" class="auth-button" id="loginButton">
                        <span class="button-text">Login</span>
                        <span class="button-loader" style="display: none;">
                            <svg class="spinner" viewBox="0 0 50 50">
                                <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="5"></circle>
                            </svg>
                        </span>
                    </button>
                </form>

                <div class="auth-footer">
                    <p>Don't have an account? <a href="signup.html">Sign up</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="about.html">About</a>
                <span class="separator">|</span>
                <a href="https://github.com/cjmDevelop/CyberSecurity-QuizApp-SY0-701" target="_blank">GitHub</a>
                <span class="separator">|</span>
                <a href="https://ko-fi.com/joe364671" target="_blank" class="donate-link">Donate</a>
            </div>
            <p class="footer-text">Made with passion for cybersecurity education</p>
        </div>
    </footer>

    <script type="module">
        import authService from './src/scripts/auth.js';

        const loginForm = document.getElementById('loginForm');
        const loginButton = document.getElementById('loginButton');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const resendVerification = document.getElementById('resendVerification');
        const resendLink = document.getElementById('resendLink');
        let currentEmail = '';

        // Check if already logged in
        if (authService.isAuthenticated()) {
            window.location.href = 'quiz-menu.html';
        }

        // Handle form submission
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            currentEmail = email;

            // Clear previous messages
            errorMessage.style.display = 'none';
            successMessage.style.display = 'none';
            resendVerification.style.display = 'none';

            // Show loading state
            loginButton.disabled = true;
            loginButton.querySelector('.button-text').style.display = 'none';
            loginButton.querySelector('.button-loader').style.display = 'inline-block';

            try {
                await authService.login(email, password);

                // Show success message
                successMessage.textContent = 'Login successful! Redirecting...';
                successMessage.style.display = 'block';

                // Redirect to quiz menu after short delay
                setTimeout(() => {
                    const redirectUrl = new URLSearchParams(window.location.search).get('redirect') || 'quiz-menu.html';
                    window.location.href = redirectUrl;
                }, 1000);

            } catch (error) {
                console.log('Login error:', error.message);
                const errorText = error.message || 'Login failed. Please try again.';

                // Check if error is due to unverified email
                const isVerificationError = errorText.toLowerCase().includes('verify') ||
                                           errorText.toLowerCase().includes('not verified') ||
                                           errorText.toLowerCase().includes('email is not verified');

                if (isVerificationError) {
                    // Definitely an email verification issue
                    resendVerification.style.display = 'block';
                    errorMessage.style.display = 'none';
                    loginButton.disabled = false;
                    loginButton.querySelector('.button-text').style.display = 'inline';
                    loginButton.querySelector('.button-loader').style.display = 'none';
                } else {
                    // Show the error for now
                    errorMessage.textContent = errorText;
                    errorMessage.style.display = 'block';
                    resendVerification.style.display = 'none';
                    loginButton.disabled = false;
                    loginButton.querySelector('.button-text').style.display = 'inline';
                    loginButton.querySelector('.button-loader').style.display = 'none';
                }
            }
        });

        // Handle resend verification link click
        resendLink.addEventListener('click', async (e) => {
            e.preventDefault();

            if (!currentEmail) {
                errorMessage.textContent = 'Please enter your email first.';
                errorMessage.style.display = 'block';
                return;
            }

            try {
                resendLink.textContent = 'Sending...';
                resendLink.style.pointerEvents = 'none';

                // Show loading state
                loginButton.disabled = true;

                await authService.resendVerificationEmail(currentEmail);

                // Store email for verification page
                localStorage.setItem('pendingUser', JSON.stringify({ email: currentEmail }));

                // Show success message
                successMessage.textContent = 'Verification email sent! Redirecting...';
                successMessage.style.display = 'block';
                resendVerification.style.display = 'none';

                // Redirect to verification page
                setTimeout(() => {
                    window.location.href = 'verify-email.html';
                }, 1000);

            } catch (error) {
                errorMessage.textContent = error.message || 'Failed to resend verification email.';
                errorMessage.style.display = 'block';
                resendVerification.style.display = 'none';
                resendLink.textContent = 'Resend verification email';
                resendLink.style.pointerEvents = 'auto';
                loginButton.disabled = false;
            }
        });
    </script>
</body>
</html>
