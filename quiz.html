<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My SY0-701 Study Web-App</title>
    <link rel="icon" href="quiz_24dp_75FB4C_FILL0_wght400_GRAD0_opsz24.png">
    <link rel="stylesheet" href="src/styles/quiz.css">
</head>
<body>
    <header>
        <div class="logo-container" style="display: flex; flex-direction: column; align-items: flex-start;">
            <a href="index.html" class="logo" style="line-height: 1; margin-bottom: 5px;">SecPlus Prep</a>
            <span class="logo-tagline" style="font-size: 0.65rem; color: #4ecdc4; font-weight: 500; line-height: 1;">Free Study Tool for Security+ SY0-701</span>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="quiz-menu.html">Quiz Menu</a>
            <a href="about.html">About</a>
        </nav>
    </header>
    <div class="banner">
        <div id="banner-content-container">
            <h1 id="quiz-id"></h1>
              <h1 id="quiz-title"></h1>
            <div>
                <h2>Question #<span id="question-number"></span> out of <span id="quiz-question-amount"></span></h2>
            </div>
            <div class="timer-container">
                <div class="timer-display">
                    <span class="timer-label">Time:</span>
                    <span id="timer">00:00</span>
                </div>
            </div>
        </div>
    </div>
    <main>
        <section>
            <div id="popup-a"><img src="spyvsspy.jpg" alt="Pop up of SpyVsSpy image indicating end of quiz"></div>
            



            <div class="quiz-container">
                <div id="quiz"></div>
                <div id="result" class="result"></div>
                <div class="arrow-container">
                    <a href="#" id="back-arrow" aria-label="Go Back"><img src="arrow_back_ios_new_24dp_000000_FILL0_wght400_GRAD0_opsz24.png" alt="Back arrow" style="filter: invert(1);"></a>
                    <div class="button-container">
                        <button id="submit" class="button">Submit</button>
                        <button id="retry" class="hide button">Retry</button>
                        <button id="showAnswer" class="hide button">Show Answers</button>
                    </div>
                    <a href="#" id="skip-arrow" aria-label="Skip"><img src="arrow_forward_ios_24dp_000000_FILL0_wght400_GRAD0_opsz24.png" alt="Forward arrow" style="filter: invert(1);"></a>
                </div>
                <div id="skip-warning" class="skip-warning hide">
                    <p>You didn't select an answer! Clicking skip again will lower your score.</p>
                </div>
            </div>
        




           
            <div id="popup-b"><img src="spyvsspy.jpg" alt="Pop up of SpyVsSpy image indicating end of quiz"></div>
        </section>
    </main>
    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="about.html">About</a>
                <span class="separator">|</span>
                <a href="https://github.com/cjmDevelop/CyberSecurity-QuizApp-SY0-701" target="_blank">GitHub</a>
                <span class="separator">|</span>
                <a href="https://ko-fi.com/joe364671" target="_blank" class="donate-link">Donate</a>
            </div>
            <p class="footer-text">Made with passion for cybersecurity education</p>
        </div>
    </footer>
    <script type="module">
        import { updateNavigation } from './src/scripts/navigation.js';
        updateNavigation();
    </script>

    <script type="module" src="src/scripts/og-script-copy.js"></script>
   
</body>
</html>
