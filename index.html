<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cybersecurity Quiz &bull; SY0-701</title>
    <link rel="stylesheet" href="styles/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/901275ddb7.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="header">
        <div>
            <h1 id="quiz-title">Cybersecurity Quiz &bull; SY0-701</h1>
        </div>
        <div>
            <button id="day-n-night" onclick="myFunction()"><i class="fa-solid fa-moon fa-2x"></i></button>
        </div>
    </div>
        <div class="quiz-container">
            <div id="quiz"></div>
            <div id="result" class="result"></div>
            <button id="submit" class="button">Submit</button>
            <button id="retry" class="hide button">Retry</button>
            <button id="showAnswer" class="hide button">Show Answer</button>
        </div>
    </div>
  
    <footer>
        <p style="font-size: 0.8rem; padding: 1rem; text-align: center; color: gray;">
            This study app was created for educational purposes and is based on publicly available SY0-701 Security+ exam
            objectives. It is not affiliated with or endorsed by CompTIA.
        </p>
    </footer>




    <script src="scripts/script.js"></script>
    <script src="scripts/checkanswer.js"></script>
</body>
</html>
