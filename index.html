<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My SY0-701 Study App</title>
    <link rel="icon" href="quiz_24dp_75FB4C_FILL0_wght400_GRAD0_opsz24.png">
    <link rel="stylesheet" href="src/styles/index.css">
</head>
<body>
    <header>
        <a href="#" class="logo">My SY0-701 Study App</a>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="quiz-menu.html">Quiz Menu</a>
            <a href="about.html">About</a>
        </nav>
    </header>
    <main>
        <div class="banner-title section landing-section active">
            <h1 class="game-title">My SY0-701 Study App</h1>
        </div>
        <div id="landing" class="section landing-section active">
            <div class="left-spy">
                <div class="spy-black">
                    <img src="blackSPY2.png" alt="Black Spy - Select Player" style="height: 200px;">
                </div>
            </div>
            <div class="right-spy">
                <div class="spy-white">
                    <img src="whiteSPY.png" alt="White Spy - Select Player" style="height: 200px;">
                </div>
            </div>
            <div class="center-content">
                <div class="buttons">
                    <a class="game-btn play-btn" href="quiz.html">Start<br>Random Quiz<br><small style="font-size: 0.6rem;">(Domain 1.0 Only)</small></a>
                    <a class="game-btn info-btn" href="signup.html">Sign Up<br>for ALL Domains<br><small style="font-size: 0.6rem;">(800+ Questions)</small></a>
                </div>
            </div>
        </div>
    </main>
  
    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="about.html">About</a>
                <span class="separator">|</span>
                <a href="https://github.com/cjmDevelop/CyberSecurity-QuizApp-SY0-701" target="_blank">GitHub</a>
                <span class="separator">|</span>
                <a href="https://ko-fi.com/joe364671" target="_blank" class="donate-link">Donate</a>
            </div>
            <p class="footer-text">Made with passion for cybersecurity education</p>
        </div>
    </footer>

    <script type="module">
        import authService from './src/scripts/auth.js';

        // Check if user is authenticated
        if (authService.isAuthenticated()) {
            const user = authService.getUser();
            // Update signup button to show "Go to Quiz Menu" for authenticated users
            const infoBtn = document.querySelector('.info-btn');
            infoBtn.href = 'quiz-menu.html';
            infoBtn.innerHTML = `Welcome, ${user.firstName}!<br>Access All Domains<br><small style="font-size: 0.6rem;">(800+ Questions)</small>`;
        }
    </script>

</body>
</html>
